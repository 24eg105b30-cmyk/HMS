# Server configuration
server.port=${PORT:8080}
spring.application.name=hospital-management-system-backend

# MongoDB Configuration
# Explicit fallback database name ensures Spring never fails with 'Database name must not be empty'
spring.data.mongodb.database=hospital_management
# Reads from MONGODB_URI environment variable (defaults to localhost:27017/hospital_management if not set)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_management}

# Logging
logging.level.root=INFO
logging.level.com.hospital.hms=INFO
logging.level.org.mongodb.driver=WARN
