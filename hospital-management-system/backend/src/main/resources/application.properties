# Server configuration
server.port=${PORT:8080}
spring.application.name=hospital-management-system-backend

# MongoDB Atlas configuration
# Database name explicitly set to hospital_management as required
spring.data.mongodb.database=hospital_management
# Reads from MONGODB_URI environment variable.
# Fast 3000ms timeout so requests fail fast with clear guidance instead of hanging for 30s when URI is not set.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_management?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000}

# Logging
logging.level.root=INFO
logging.level.com.hospital.hms=INFO
logging.level.org.mongodb.driver=WARN
