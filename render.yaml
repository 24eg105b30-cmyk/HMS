services:
  - type: web
    name: hospital-management-backend
    env: java
    region: oregon
    plan: free
    rootDir: hospital-management-system/backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/hospital-management-system-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 8080
